<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>管理端 · 待审批队列</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
    h2 { color: #333; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .card .title { font-weight: bold; margin-bottom: 6px; }
    .card .meta { color: #666; font-size: 14px; margin-bottom: 10px; }
    button { padding: 6px 16px; margin-right: 8px; border: none; border-radius: 4px; cursor: pointer; }
    .approve { background: #4caf50; color: white; }
    .reject { background: #f44336; color: white; }
    .empty { color: #999; text-align: center; margin-top: 40px; }
    #refresh { background: #2196f3; color: white; margin-bottom: 16px; }
  </style>
</head>
<body>
  <h2>管理端 · 待审批队列</h2>
  <button id="refresh" onclick="load()">刷新列表</button>
  <div id="list"><div class="empty">加载中...</div></div>

  <script>
    async function load() {
      const list = document.getElementById('list');
      try {
        const res = await fetch('/api/approvals');
        const data = await res.json();

        if (!data || data.length === 0) {
          list.innerHTML = '<div class="empty">暂无待审批工单</div>';
          return;
        }

        list.innerHTML = data.map(a => `
          <div class="card">
            <div class="title">#${a.id} · 结论：${a.decision}</div>
            <div class="meta">置信度：${a.confidence}</div>
            <div class="meta">用户诉求：${a.user_request}</div>
            <button class="approve" onclick="submit(${a.id}, 'approve')">批准</button>
            <button class="reject" onclick="submit(${a.id}, 'reject')">拒绝</button>
          </div>
        `).join('');
      } catch (e) {
        list.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
      }
    }

    async function submit(id, action) {
      const reason = action === 'reject' ? prompt('请输入拒绝理由：') : '';
      const res = await fetch(`/api/approvals/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, reason })
      });
      const result = await res.json();
      alert(`审批完成：${result.status}\n回复用户：${result.reply}`);
      load();
    }

    load();  // 首次加载
  </script>
</body>
</html>
